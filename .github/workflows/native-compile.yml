name: Native crate compile (ONNX + GGUF)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install native build deps (llama.cpp)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake
      - run: cargo check -p uie-loader-onnx
      - run: cargo check -p uie-mnist
      - run: cargo check -p uie-loader-gguf -p uie-llm