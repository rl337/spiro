[package]
name = "uie-e2e"
description = "End-to-end test harness (application + command-pattern scenarios)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "uie-e2e"
path = "src/main.rs"

[features]
default = []
gguf = ["dep:uie-loader-gguf"]
safetensors = ["dep:uie-loader-safetensors", "dep:uie-pipeline"]
spiro-chain = ["safetensors", "gguf"]

[dependencies]
uie-core = { path = "../uie-core" }
uie-catalog = { path = "../uie-catalog" }
uie-stub-models = { path = "../uie-stub-models" }
uie-telemetry = { path = "../uie-telemetry" }
uie-pipeline = { path = "../uie-pipeline", optional = true }
uie-loader-safetensors = { path = "../uie-loader-safetensors", optional = true }
uie-loader-gguf = { path = "../uie-loader-gguf", optional = true }
image = "0.24"
glob = "0.3"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"