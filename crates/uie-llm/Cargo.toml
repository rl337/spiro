[package]
name = "uie-llm"
description = "US-010 text completion CLI over GGUF (LM Studio paths)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "uie-llm"
path = "src/main.rs"

[features]
default = []
# Build llama.cpp with Vulkan (Pi 5 V3D / Mesa). Used by crystalline experiment image.
vulkan = ["uie-loader-gguf/vulkan"]

[dependencies]
uie-catalog = { path = "../uie-catalog" }
uie-core = { path = "../uie-core" }
uie-iv = { path = "../uie-iv" }
uie-loader-gguf = { path = "../uie-loader-gguf" }
tracing-subscriber = "0.3"
tracing.workspace = true