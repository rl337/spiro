[workspace]
resolver = "2"
members = [
    "crates/uie-core",
    "crates/uie-loader-onnx",
    "crates/uie-mnist",
    "crates/uie-spiro",
    "crates/uie-stub-models",
    "crates/uie-stubs",
    "crates/uie-ipc",
    "crates/uie-serve",
    "crates/uie-catalog",
    "crates/uie-pipeline",
    "crates/uie-acceptance",
    "crates/uie-loader-gguf",
    "crates/uie-loader-safetensors",
    "crates/uie-llm",
    "crates/uie-telemetry",
    "crates/uie-iv",
    "crates/uie-e2e",
    "crates/uie-wasm",
    "crates/uie-embeddings",
]
default-members = ["crates/uie-spiro"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "."
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16"
tract-onnx = "0.21"