# Machine-readable governance for US-0NN stories, acceptance tests, and check-ins.
# Enforced by scripts/verify-story-governance.py (CI).

# Rust/Python acceptance sources must include at least one of these substrings.
observability_markers:
  - assert_stub_executor_telemetry
  - assert_stub_modality_telemetry
  - assert_phases
  - assert_story_events
  - assert_infer_outcome_trace
  - assert_ipc_infer_trace
  - assert_ipc_infer_trace_summary
  - assert_trace_summary
  - StoryEventLog
  - assert_ipc_infer_has_trace

# Paths that never require a story mapping on diff (tooling, lockfiles, governance itself).
diff_exempt_globs:
  - ".github/**"
  - "config/story_governance.yaml"
  - "scripts/verify-story-governance.py"
  - "**/Cargo.lock"
  - "rust-toolchain.toml"
  - ".cursor/**"

# Changed files under these globs must be justified by a story (see diff_rules).
diff_rules:
  - glob: "crates/**"
    stories: [US-001, US-002, US-003, US-004, US-005, US-006, US-007, US-008, US-009, US-010, US-011, US-012, US-013, US-014, US-015, US-016, US-017, US-018, US-019, US-020, US-021, US-022, US-023, US-024]
  - glob: "python/**"
    stories: [US-020]
  - glob: "docs/stories/**"
    stories: [US-001, US-002, US-003, US-004, US-005, US-006, US-007, US-008, US-009, US-010, US-011, US-012, US-013, US-014, US-015, US-016, US-017, US-018, US-019, US-020, US-021, US-022, US-023, US-024]
  - glob: "models/**"
    stories: [US-007, US-009, US-010, US-011, US-012, US-013, US-014, US-016, US-017, US-018, US-019]

